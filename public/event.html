<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Live Session · CrowdPulse</title>
<meta name="theme-color" content="#07051a">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/raters.css">
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .ev-head { display: flex; gap: 14px; align-items: center; min-width: 0; }
  .ev-head .t { min-width: 0; }
  .ev-head h1 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-head .sub { font-size: .78rem; color: var(--muted); }
  .me-btn { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--stroke-2); background: var(--panel); cursor: pointer; }
  .me-btn .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 35%, transparent); }
  .me-btn .nm { font-size: .82rem; font-weight: 600; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stagewrap { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .side { position: sticky; top: 84px; height: calc(100vh - 110px); display: flex; flex-direction: column; }
  .side .card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; position: relative; background: transparent; border: 0; padding: 10px 8px; border-radius: 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tabs button.on { background: var(--panel-2); color: var(--text); }
  .tabs .dot { position: absolute; top: 4px; right: 10px; min-width: 18px; height: 18px; border-radius: 9px; font-size: .68rem; background: var(--accent-2); color: white; display: grid; place-items: center; padding: 0 5px; animation: popIn .4s; }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .pane.on { display: flex; }
  .pane .scroll { flex: 1; min-height: 0; }

  .modes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: -4px -4px 14px; padding-left: 4px; scrollbar-width: none; }
  .modes::-webkit-scrollbar { display: none; }
  .modes button { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--stroke); background: rgba(0,0,0,.2); cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); transition: all .2s; }
  .modes button.on { background: var(--grad); color: white; border-color: transparent; box-shadow: 0 6px 20px -8px var(--accent-2); }
  #rater { min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
  .sent { text-align: center; font-size: .78rem; color: var(--dim); height: 1.2em; transition: color .3s; }
  .sent.ok { color: var(--good); }

  .reactbar { display: flex; justify-content: space-between; gap: 6px; }
  .reactbar button { flex: 1; font-size: 1.6rem; padding: 10px 0; border-radius: 16px; border: 1px solid var(--stroke); background: rgba(0,0,0,.2); cursor: pointer; transition: transform .12s; touch-action: manipulation; }
  .reactbar button:active { transform: scale(.8) rotate(-8deg); }

  .crowd { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: center; }
  .crowd .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .crowd .mini-stats div { background: rgba(0,0,0,.2); border-radius: 12px; padding: 8px; text-align: center; }
  .crowd .mini-stats b { font-family: var(--display); font-size: 1.2rem; display: block; }
  .crowd .mini-stats small { color: var(--dim); font-size: .7rem; }
  .you-vs { font-size: .85rem; color: var(--muted); margin-top: 8px; }

  .lobby { text-align: center; padding: 20px 0; }
  .ring { width: 220px; height: 220px; margin: 10px auto 20px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .cd { position: absolute; inset: 0; display: grid; place-content: center; }
  .ring .cd b { font-family: var(--display); font-size: 2.4rem; }
  .ring .cd small { color: var(--muted); }

  .banner { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 150; width: min(560px, 92vw); padding: 14px 18px; border-radius: 16px; background: var(--grad); color: white; font-weight: 600; box-shadow: 0 20px 60px -10px var(--accent-2); animation: slideDown .6s cubic-bezier(.2,1.4,.4,1); display: flex; gap: 10px; align-items: center; }
  @keyframes slideDown { from { transform: translate(-50%, -140%); } }
  .pinned { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); margin-bottom: 10px; font-size: .88rem; }
  .typing { font-size: .75rem; color: var(--dim); height: 1.3em; padding: 2px 4px; }

  .poll-pop { border: 1px solid color-mix(in srgb, var(--accent-2) 60%, transparent); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }

  .mobnav { display: none; }
  .fb-stars { display: flex; gap: 6px; justify-content: center; }
  .fb-stars button { font-size: 2.2rem; background: none; border: 0; cursor: pointer; filter: grayscale(1) opacity(.4); transition: all .25s cubic-bezier(.2,1.8,.4,1); }
  .fb-stars button.on { filter: none; transform: scale(1.15); }
  .nps { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .nps button { padding: 10px 0; border-radius: 8px; border: 1px solid var(--stroke); background: rgba(0,0,0,.2); cursor: pointer; font-weight: 700; font-size: .85rem; transition: all .2s; }
  .nps button.on { background: var(--mc); color: #07051a; border-color: transparent; transform: translateY(-3px); }
  .aspect { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 10px; margin-top: 8px; }
  .aspect .dots { display: flex; gap: 6px; }
  .aspect .dots button { flex: 1; height: 12px; border-radius: 6px; border: 0; background: rgba(255,255,255,.1); cursor: pointer; transition: background .2s; }
  .aspect .dots button.on { background: var(--grad-cool); }
  .avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .avatar-grid button { font-size: 1.4rem; padding: 6px 0; border-radius: 10px; border: 1px solid transparent; background: rgba(0,0,0,.2); cursor: pointer; }
  .avatar-grid button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .spot { position: fixed; inset: 0; z-index: 250; display: grid; place-items: center; background: rgba(3,2,14,.75); backdrop-filter: blur(10px); animation: fade .3s; padding: 20px; }
  .spot .card { max-width: 640px; text-align: center; font-size: 1.4rem; font-family: var(--display); animation: pop .6s cubic-bezier(.2,1.4,.4,1); }

  @media (max-width: 900px) {
    .stagewrap { grid-template-columns: 1fr; }
    .side { position: static; height: auto; }
    .side .tabs { display: none; }
    .side .card { flex: none; height: calc(100dvh - 170px); min-height: 380px; }
    #toasts { bottom: 90px; }
    body[data-tab="rate"] .side { display: none; }
    body:not([data-tab="rate"]) .main-col { display: none; }
    .mobnav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(10,7,32,.9); backdrop-filter: blur(16px); border-top: 1px solid var(--stroke); }
    .mobnav button { flex: 1; display: grid; justify-items: center; gap: 2px; background: none; border: 0; color: var(--dim); font-size: .7rem; font-weight: 600; cursor: pointer; position: relative; padding: 4px 0; }
    .mobnav button span { font-size: 1.3rem; transition: transform .3s cubic-bezier(.2,1.8,.4,1); }
    .mobnav button.on { color: var(--text); }
    .mobnav button.on span { transform: translateY(-3px) scale(1.15); }
    .mobnav .dot { position: absolute; top: 0; left: 55%; min-width: 16px; height: 16px; border-radius: 8px; font-size: .62rem; background: var(--accent-2); color: white; display: grid; place-items: center; padding: 0 4px; }
    .crowd { grid-template-columns: 1fr; }
    .ev-head .sub { display: none; }
    .me-btn .nm { display: none; } .me-btn { padding: 4px; }
  }
</style>
</head>
<body data-tab="rate">
<header class="topbar">
  <div class="ev-head"><span id="brandMark"></span><div class="t"><h1 id="evTitle">Loading…</h1><div class="sub" id="evSub"></div></div></div>
  <span class="spacer"></span><span id="statusPill"></span>
  <button class="me-btn" id="meBtn"><span class="av" id="meAv">🙂</span><span class="nm" id="meName"></span></button>
</header>

<main class="wrap">
  <div class="stagewrap">
    <div class="main-col grid" id="mainCol"></div>
    <aside class="side">
      <div class="card">
        <div class="tabs" id="tabs">
          <button data-tab="chat" class="on">💬 Chat<span class="dot hidden"></span></button>
          <button data-tab="qa">🙋 Q&amp;A<span class="dot hidden"></span></button>
          <button data-tab="polls">📊 Polls<span class="dot hidden"></span></button>
        </div>
        <section class="pane on" data-pane="chat">
          <div id="pinned"></div>
          <div class="scroll chat-list" id="chat"></div>
          <div class="typing" id="typing"></div>
          <form class="composer" id="chatForm"><input class="input" id="chatIn" maxlength="280" placeholder="Say something nice…" autocomplete="off"><button class="btn primary icon" aria-label="Send">➤</button></form>
        </section>
        <section class="pane" data-pane="qa">
          <form class="composer" id="askForm" style="margin-bottom:12px"><input class="input" id="askIn" maxlength="240" placeholder="Ask the presenter a question…" autocomplete="off"><button class="btn primary sm">Ask</button></form>
          <div class="scroll grid" id="qa" style="gap:10px;align-content:start"></div>
        </section>
        <section class="pane" data-pane="polls"><div class="scroll grid" id="polls" style="gap:14px;align-content:start"></div></section>
      </div>
    </aside>
  </div>
</main>

<nav class="mobnav" id="mobnav">
  <button data-tab="rate" class="on"><span>🎚️</span>Rate</button>
  <button data-tab="chat"><span>💬</span>Chat<i class="dot hidden"></i></button>
  <button data-tab="qa"><span>🙋</span>Q&amp;A<i class="dot hidden"></i></button>
  <button data-tab="polls"><span>📊</span>Polls<i class="dot hidden"></i></button>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/raters.js"></script>
<script src="/js/event.js"></script>
</body>
</html>
