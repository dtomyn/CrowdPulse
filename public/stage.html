<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage · CrowdPulse</title>
<meta name="theme-color" content="#07051a">
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .stage { height: 100vh; display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: auto 1fr auto; gap: 2vh 2vw; padding: 3vh 3vw; }
  .s-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 2vw; }
  .s-head h1 { font-size: clamp(1.6rem, 3.4vw, 3.4rem); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .join { display: flex; align-items: center; gap: 1.4vw; padding: 1.2vh 1.4vw; border-radius: 22px; background: var(--panel); border: 1px solid var(--stroke-2); }
  .join .qr { background: white; border-radius: 14px; padding: 6px; width: clamp(90px, 11vh, 150px); }
  .join .qr img { width: 100%; display: block; }
  .join .c { font-family: var(--display); font-size: clamp(1.6rem, 3vw, 3rem); font-weight: 700; letter-spacing: .2em; line-height: 1; }
  .join small { color: var(--muted); font-size: clamp(.75rem, 1vw, 1rem); }
  .s-gauge { display: grid; place-items: center; }
  .s-gauge .gauge { max-width: min(56vh, 680px); }
  .s-gauge .gauge .readout .num { font-size: clamp(3rem, 9vh, 7rem); }
  .s-gauge .gauge .face { font-size: clamp(2.4rem, 7vh, 5rem); }
  .s-right { display: grid; grid-template-rows: auto 1fr; gap: 2vh; min-height: 0; }
  .s-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vw; }
  .s-stats .kpi .v { font-size: clamp(1.6rem, 4vh, 3rem); }
  .ticker { min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 1vh; mask-image: linear-gradient(to bottom, transparent, black 30%); }
  .ticker .msg .bubble { font-size: clamp(.9rem, 1.6vh, 1.25rem); }
  .s-chart { grid-column: 1 / -1; height: 22vh; width: 100%; }
  .big-lobby { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; z-index: 5; background: radial-gradient(circle at 50% 40%, rgba(124,92,255,.25), transparent 60%), rgba(7,5,26,.9); }
  .big-lobby .qr { width: min(44vh, 420px); background: white; border-radius: 30px; padding: 18px; margin: 3vh auto; box-shadow: 0 0 120px -20px var(--accent-2); animation: breathe 4s ease-in-out infinite; }
  .big-lobby .qr img { width: 100%; display: block; }
  @keyframes breathe { 50% { transform: scale(1.03); box-shadow: 0 0 160px -10px var(--accent); } }
  .big-lobby .c { font-family: var(--display); font-weight: 700; font-size: clamp(2.6rem, 7vh, 5rem); letter-spacing: .3em; }
  .crowd-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 70vw; margin: 2vh auto 0; }
  .crowd-dots span { font-size: 1.8rem; animation: popIn .5s cubic-bezier(.2,1.8,.4,1) both; }
  .spot { position: fixed; inset: 0; z-index: 250; display: grid; place-items: center; background: rgba(3,2,14,.8); backdrop-filter: blur(12px); animation: fade .3s; }
  .spot .card { max-width: 70vw; text-align: center; font-size: clamp(1.6rem, 4vh, 3rem); font-family: var(--display); padding: 5vh 4vw; animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  .poll-ov { position: fixed; right: 3vw; bottom: 3vh; width: min(34vw, 560px); z-index: 60; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  .banner { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); z-index: 150; padding: 2vh 3vw; border-radius: 22px; background: var(--grad); font-size: clamp(1.2rem, 2.6vh, 2rem); font-weight: 700; box-shadow: 0 20px 60px -10px var(--accent-2); animation: slideDown .6s cubic-bezier(.2,1.4,.4,1); max-width: 80vw; text-align: center; }
  @keyframes slideDown { from { transform: translate(-50%, -160%); } }
  .fs { position: fixed; right: 14px; bottom: 14px; z-index: 70; opacity: .3; } .fs:hover { opacity: 1; }
  @media (max-width: 800px) { html, body { overflow: auto; height: auto; } .stage { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="s-head">
    <div style="min-width:0;flex:1"><div class="row" style="gap:10px"><span id="pill"></span><span class="muted" id="timer"></span><span class="muted" id="marker"></span></div><h1 id="title">…</h1></div>
    <div class="join"><div class="qr"><img id="qr" alt="QR code"></div><div><small>Join at <b id="host"></b> with code</small><div class="c" id="code"></div></div></div>
  </div>
  <div class="s-gauge"><div id="gauge"></div></div>
  <div class="s-right">
    <div class="s-stats">
      <div class="kpi" style="--kc:#2ee6d6"><div class="k">In the room</div><div class="v" id="kOnline">0</div></div>
      <div class="kpi" style="--kc:#ff5ca8"><div class="k">Energy</div><div class="v" id="kEnergy">0</div></div>
      <div class="kpi" style="--kc:#ffb547"><div class="k">Reactions / min</div><div class="v" id="kRpm">0</div></div>
    </div>
    <div class="ticker chat-list" id="ticker"></div>
  </div>
  <canvas class="s-chart" id="chart"></canvas>
</div>
<div id="lobby" class="big-lobby hidden"></div>
<button class="btn sm fs" id="fs">⛶ Fullscreen</button>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script>
(function () {
  const { $, esc, h } = CP;
  const code = CP.codeFromPath();
  const bg = CP.backdrop({ intensity: .34, stars: 140 });
  const socket = io({ transports: ['websocket', 'polling'] });
  const gauge = CP.gauge($('#gauge'), { big: true });
  const chart = CP.pulseChart($('#chart'), { windowMs: 0 });
  let S = null, joinUrl = '';
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

  socket.on('connect', () => socket.emit('watch', { code }, res => {
    if (res.error) { document.body.innerHTML = '<div class="empty" style="margin-top:20vh">Session not found</div>'; return; }
    S = res; joinUrl = res.joinUrl; render();
  }));

  function render() {
    const ev = S.event;
    document.documentElement.style.setProperty('--accent', ev.accent);
    document.title = ev.title + ' · Stage';
    $('#title').textContent = ev.title; $('#code').textContent = ev.code;
    $('#qr').src = `/api/events/${code}/qr.svg`; $('#host').textContent = new URL(joinUrl).host;
    $('#pill').innerHTML = `<span class="pill ${ev.status}">${ev.status === 'live' ? 'LIVE' : ev.status.toUpperCase()}</span>`;
    chart.setStart(ev.startedAt); chart.set(S.history); chart.markers(S.markers);
    const m = S.markers[S.markers.length - 1]; $('#marker').textContent = m ? '· ' + m.label : '';
    $('#ticker').innerHTML = ''; S.messages.slice(-12).forEach(addMsg);
    if (S.pulse) onPulse(S.pulse);
    lobby(); pollOverlay();
  }

  function lobby() {
    const ev = S.event, L = $('#lobby');
    if (ev.status === 'live') { L.classList.add('hidden'); return; }
    L.classList.remove('hidden');
    if (ev.status === 'ended') {
      L.innerHTML = `<div><div class="eyebrow">That's a wrap</div><h1 style="font-size:clamp(2.4rem,7vh,5rem);margin-top:2vh">Thank you! 💜</h1>
        <p class="muted" style="font-size:clamp(1rem,2.4vh,1.6rem)">Scan to leave a quick review</p><div class="qr" style="width:min(32vh,320px)"><img src="/api/events/${code}/qr.svg"></div><div class="c">${ev.code}</div></div>`;
      return;
    }
    L.innerHTML = `<div><div class="eyebrow">Starting soon · ${esc(CP.fmtDate(ev.startsAt))}</div>
      <h1 style="font-size:clamp(2rem,6vh,4.4rem);margin-top:1.5vh;max-width:80vw">${esc(ev.title)}</h1>
      ${ev.presenter ? `<div class="muted" style="font-size:clamp(1rem,2.2vh,1.5rem)">with ${esc(ev.presenter)}</div>` : ''}
      <div class="qr"><img src="/api/events/${code}/qr.svg"></div>
      <div class="muted" style="font-size:clamp(1rem,2.2vh,1.4rem)">Scan or go to <b>${esc(new URL(joinUrl).host)}</b> and enter</div>
      <div class="c gradient-text">${ev.code}</div>
      <div class="crowd-dots" id="dots"></div><div class="muted" id="dotsN" style="margin-top:1vh"></div></div>`;
    paintDots();
  }
  function paintDots() {
    const d = $('#dots'); if (!d) return;
    const n = S.pulse?.online ?? 0; const avatars = [...new Set(S.messages.map(m => m.avatar))];
    const have = d.children.length;
    for (let i = have; i < Math.min(n, 80); i++) d.appendChild(h(`<span style="animation-delay:${(i - have) * 40}ms">${avatars[i % Math.max(1, avatars.length)] || CP.AVATARS[i % CP.AVATARS.length]}</span>`));
    while (d.children.length > n) d.lastElementChild.remove();
    $('#dotsN').textContent = n ? `${n} ${n === 1 ? 'person has' : 'people have'} joined` : 'Be the first to join!';
  }

  function onPulse(p) {
    S.pulse = p;
    gauge.set(p.avg, p.avg == null ? 'Rate along on your phone' : `${CP.mood(p.avg).label} · ${p.n} voices`);
    bg.setMood(p.avg);
    CP.countUp($('#kOnline'), p.online, { dur: 600 }); CP.countUp($('#kEnergy'), p.energy, { dur: 600 }); CP.countUp($('#kRpm'), p.rpm, { dur: 600 });
    $('#timer').textContent = CP.fmtClock(p.elapsed);
    if (p.avg != null) chart.live({ t: p.t, avg: p.avg, online: p.online });
  }
  socket.on('pulse', onPulse);
  setInterval(() => { if (S && S.event.status !== 'live') paintDots(); }, 2000);
  socket.on('admin-summary', () => {});
  socket.on('history-point', p => chart.commit(p));
  socket.on('marker', m => { chart.addMarker(m); $('#marker').textContent = '· ' + m.label; });
  socket.on('reaction', r => CP.floatEmoji(r.e, { size: 2.4 + Math.random() * 2 }));
  socket.on('confetti', () => CP.confetti(260));
  function addMsg(m) {
    const t = $('#ticker'); t.appendChild(CP.renderMsg(m, null));
    while (t.children.length > 12) t.firstElementChild.remove();
  }
  socket.on('chat', m => { S.messages.push(m); addMsg(m); });
  socket.on('chat-delete', id => $(`#ticker [data-id="${id}"]`)?.remove());
  socket.on('event', ev => { const ch = ev.status !== S.event.status; S.event = ev; if (ch) { if (ev.status === 'live') CP.confetti(200); render(); } });
  socket.on('polls', ps => { S.polls = ps; pollOverlay(); });
  socket.on('reset', () => location.reload());
  function pollOverlay() {
    document.querySelector('.poll-ov')?.remove();
    const p = S.polls.find(x => x.open); if (!p) return;
    const total = Math.max(1, p.total);
    const el = h(`<div class="card glow poll-ov"><div class="row"><span class="pill live">LIVE POLL</span><span class="spacer"></span><b>${p.total} votes</b></div>
      <h2 style="margin:12px 0 6px">${esc(p.question)}</h2>${p.options.map(o => `<div class="poll-opt" style="cursor:default;font-size:1.1rem"><div class="fill" style="width:${(o.votes / total) * 100}%"></div><span>${esc(o.text)}</span><span>${Math.round((o.votes / total) * 100)}%</span></div>`).join('')}</div>`);
    document.body.appendChild(el);
  }
  socket.on('announce', a => {
    document.querySelector('.banner')?.remove();
    const b = h(`<div class="banner">📣 ${esc(a.text)}</div>`); document.body.appendChild(b); setTimeout(() => b.remove(), 12000);
  });
  socket.on('spotlight', q => {
    const el = h(`<div class="spot"><div class="card glow"><div class="eyebrow" style="font-family:var(--font)">🔦 Audience question</div><p style="margin:3vh 0">"${esc(q.text)}"</p><div class="muted" style="font-size:.6em;font-family:var(--font)">${esc(q.avatar)} ${esc(q.name)}</div></div></div>`);
    el.onclick = () => el.remove(); document.body.appendChild(el); setTimeout(() => el.remove(), 10000);
  });
})();
</script>
</body>
</html>
